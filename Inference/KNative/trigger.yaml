# File: trigger.yaml
# Purpose: Route CloudEvents from the Knative Broker to payload logging consumer services
# Dependencies: broker.yaml applied first (Broker 'default' must be Ready);
#               consumers.yaml applied first (consumer Services must be Running in namespace default)

# SECURITY: mTLS and AuthorizationPolicy intentionally omitted.
# For production hardening add PeerAuthentication and AuthorizationPolicy.

---
# payload-archiver-trigger: receives ALL events (request + response) — no filter.
# Sink archives every inference payload for audit, replay, and dataset reconstruction.
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: payload-archiver-trigger
  namespace: knative-serving
spec:
  broker: default
  subscriber:
    uri: http://payload-archiver.default.svc.cluster.local

---
# drift-detector-trigger: filters on inference REQUEST events only.
# Sink compares feature distributions against the training baseline to detect covariate drift.
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: drift-detector-trigger
  namespace: knative-serving
spec:
  broker: default
  filter:
    attributes:
      type: org.kubeflow.serving.inference.request
  subscriber:
    uri: http://drift-detector.default.svc.cluster.local

