# File: consumers.yaml
# Purpose: Stub consumer Deployment + ClusterIP Service for the CloudEvent payload logging pipeline
# Dependencies: namespace inference-logging must exist (namespace.yaml);
#               ../trigger.yaml will route events here once the Broker is Ready

# SECURITY: mTLS and AuthorizationPolicy intentionally omitted.
# For production hardening add PeerAuthentication and AuthorizationPolicy.

---
# payload-archiver: echo-stub for now — logs every received CloudEvent to stdout
# (kubectl logs -n inference-logging -l app=payload-archiver).
# NEXT STEP (not built here): replace with a service that writes CloudEvent
# payloads to durable storage (e.g. Azure Blob Storage / data lake).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload-archiver
  namespace: inference-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payload-archiver
  template:
    metadata:
      labels:
        app: payload-archiver
    spec:
      containers:
      - name: payload-archiver
        image: docker.io/mendhak/http-https-echo:33
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: payload-archiver
  namespace: inference-logging
spec:
  type: ClusterIP
  selector:
    app: payload-archiver
  ports:
  - port: 80
    targetPort: 8080
