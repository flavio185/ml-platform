# kube-prometheus-stack values
# Deploys Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics
# Runs on default nodepool1 (no nodeSelector/tolerations)

prometheus:
  prometheusSpec:
    # Discover ServiceMonitors from ALL namespaces (not just the helm release namespace).
    # Required for KServe, KubeRay, and MLflow metrics to be scraped.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "6Gi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  adminUser: admin
  adminPassword: admin
  service:
    type: LoadBalancer
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        timeout: 60
        maxLines: 1000

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
