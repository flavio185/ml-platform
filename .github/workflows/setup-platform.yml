name: Setup ML Platform

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm AKS cluster provisioning (this creates billable Azure resources)'
        required: true
        default: 'no'

jobs:
  setup-platform:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    defaults:
      run:
        working-directory: ml-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Extract Azure credential fields
        run: |
          echo "AZURE_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "AZURE_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV
          echo "AZURE_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "AZURE_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          cat > .env << EOF
          export SUBSCRIPTION_ID="${AZURE_SUBSCRIPTION_ID}"
          export RESOURCE_GROUP="${{ vars.RESOURCE_GROUP }}"
          export AKS_CLUSTER_NAME="${{ vars.AKS_CLUSTER_NAME }}"
          export TENANT_ID="${AZURE_TENANT_ID}"
          export CLIENT_ID="${AZURE_CLIENT_ID}"
          export SECRET="${AZURE_CLIENT_SECRET}"
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          EOF

      - name: Make scripts executable
        run: |
          chmod +x setup.sh
          find . -name "*.sh" -exec chmod +x {} \;

      - name: Run setup.sh
        run: bash setup.sh
